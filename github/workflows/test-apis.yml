name: api-test
on: {workflow_dispatch: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://search.codal.ir/api/search/v2/q?PageNumber=1&length=1" \
                   "https://fipiran.ir/" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$u" || echo FAIL)
            echo "$u => $code"
          done
