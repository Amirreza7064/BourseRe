name: test2-sources
on: {workflow_dispatch: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0"
          for u in \
            "https://www.fipiran.ir/" \
            "https://fipiran.ir/api/v1/fund/all" \
            "https://rahavard365.com/" \
            "https://www.sahmad.com/" \
            "https://sahmebourse.ir/" \
            "https://www.tgju.org/" \
            "https://www.emofid.com/" \
            "https://www.agah.com/" \
            "https://boursepress.ir/" \
            "https://ijse.com/" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" --max-time 15 "$u" || echo 000)
            echo "$u => $code"
          done
