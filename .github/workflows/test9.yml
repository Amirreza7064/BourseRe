name: test9-final-sweep
on: {workflow_dispatch: {}}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: sweep
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"

          echo "=== ۱) کلید رله: t.me/s باز است؟ ==="
          code=$(curl -s -o /tmp/tg.html -A "$UA" --max-time 15 -w "%{http_code}" "https://t.me/s/telegram" 2>/dev/null)
          echo "  t.me/s/telegram => ${code:-000} | بلاک‌های پیام: $(grep -o 'class="tgme_widget_message_text"' /tmp/tg.html 2>/dev/null | wc -l)"

          echo ""
          echo "=== ۲) سایت‌های تست‌نشده ==="
          for u in "https://www.ifb.ir/" "https://bestamooz.com/" "https://sahmplus.com/" \
                   "https://tahlilbazaar.com/" "https://bourseview.com/" "https://www.irbourse.com/" \
                   "https://www.boursenews.ir/" "https://www.sahmefarda.ir/" \
                   "https://xzn.ir/" "https://ultraweb.ir/" ; do
            rm -f /tmp/p.html
            c=$(curl -sL -o /tmp/p.html -A "$UA" --max-time 12 -w "%{http_code}" "$u" 2>/dev/null)
            f=$(grep -o 'فولاد' /tmp/p.html 2>/dev/null | wc -l)
            echo "  $u => ${c:-000} ($(wc -c < /tmp/p.html 2>/dev/null || echo 0)B | فولاد:$f)"
          done

          echo ""
          echo "=== ۳) کالبدشکافی عمیق مفید (۷۴۲KB) ==="
          curl -sL -A "$UA" --max-time 30 "https://www.emofid.com/market-watch/" -o /tmp/mf.html 2>/dev/null
          python3 - <<'PY'
          import re
          h = open('/tmp/mf.html', encoding='utf-8', errors='ignore').read()
          print(f"  حجم خام: {len(h)//1024}KB")
          esc = r"\u0641\u0648\u0644\u0627\u062F"
          print(f"  یونیکد اسکیپ «فولاد»: {h.count(esc)} بار")
          for k in ("insCode","insId","lVal18AFC","pClosing","priceLast","zTotTran","marketWatch","stocks"):
              print(f"  کلید {k}: {h.count(k)} بار")
          txt = re.sub(r'<[^>]+>', ' ', h)
          txt = re.sub(r'\s+', ' ', txt)
          for s in ("فولاد","شستا","شپنا","فملی"):
              print(f"  متن بی‌تگ «{s}»: {txt.count(s)} بار")
          i = txt.find("فولاد")
          if i >= 0: print("  بافت:", txt[max(0,i-150):i+250][:400])
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', h, re.S)
          if scripts:
              big = max(scripts, key=len)
              print(f"  بزرگ‌ترین <script>: {len(big)//1024}KB | شامل فولاد: {big.count('فولاد')}")
          PY

          echo ""
          echo "=== ۴) Wayback: تازه‌ترین اسنپ‌شات TSETMC ==="
          curl -s --max-time 15 "http://archive.org/wayback/available?url=www.tsetmc.com" 2>/dev/null
          echo

          echo ""
          echo "=== END ==="
