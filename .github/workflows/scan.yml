name: daily-scan

on:
  schedule:
    - cron: "0 6 * * 6,0-3"    # ۹:۳۰ تهران — سرخطی صبح
    - cron: "0 10 * * 6,0-3"   # ۱۳:۳۰ تهران — غربالگری بعد بازار
  workflow_dispatch:
    inputs:
      mode:
        description: 'چه پیامی ارسال شود؟'
        type: choice
        default: "both"
        options:
          - both
          - morning
          - afternoon

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u bot.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || ((github.event.schedule == '0 6 * * 6,0-3') && 'morning' || 'afternoon') }}
