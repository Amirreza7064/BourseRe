name: daily-scan

on:
  schedule:
    # زمان‌ها بر حسب UTC (تهران = UTC+3:30)
    # عمداً دقیقهٔ صفر انتخاب نشده تا از ترافیک سنگین ابتدای ساعت‌ها در گیت‌هاب فرار کنیم
    - cron: "5 6 * * 6,0-3"     # ۹:۳۵ تهران — سرخطی صبح
    - cron: "15 10 * * 6,0-3"   # ۱۳:۴۵ تهران — غربالگری بعد بازار
  workflow_dispatch:
    inputs:
      mode:
        description: 'چه پیامی ارسال شود؟'
        type: choice
        default: "both"
        options:
          - both
          - morning
          - afternoon

# جلوگیری از اجرای هم‌زمان و تودرتو
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u bot.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '5 6 * * 6,0-3' && 'morning' || 'afternoon') }}
