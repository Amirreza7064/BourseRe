name: daily-scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'چه پیامی ارسال شود؟'
        type: choice
        default: "both"
        options:
          - both
          - morning
          - afternoon
          - poll

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # در poll فقط requests لازم است (سریع) — بقیهٔ حالت‌ها کل requirements
      - if: github.event.inputs.mode == 'poll'
        run: pip install -q requests
      - if: github.event.inputs.mode != 'poll'
        run: pip install -q -r requirements.txt
      - run: python -u bot.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUN_MODE: ${{ github.event.inputs.mode || 'both' }}
