name: daily-scan

on:
  schedule:
    - cron: "0 10 * * 6,0-3"   # ۱۳:۰۰ تهران، شنبه تا چهارشنبه
  workflow_dispatch: {}          # امکان اجرای دستی برای تست

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u bot.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
