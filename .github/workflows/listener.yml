name: bale-listener

on:
  workflow_dispatch: {}

# هر بار اجرای جدید، اجرای قبلی خاموش می‌شود (فقط یک شنودگر زنده)
concurrency:
  group: bale-listener
  cancel-in-progress: true

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # ~۵ ساعت و ۵۰ دقیقه (سقف امن زیر ۶ ساعت)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python -u bot.py
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUN_MODE: listen
