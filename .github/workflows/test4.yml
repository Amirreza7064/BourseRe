name: test4-deep-mining
on: {workflow_dispatch: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: deep-mining
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          g() { curl -sL -A "$UA" --max-time 25 "$1" -o "$2" 2>/dev/null; }

          echo "===== 1) مفید: آیا داده داخل HTML است؟ ====="
          g "https://www.emofid.com/market-watch/" /tmp/mf.html
          echo "  حجم: $(wc -c < /tmp/mf.html 2>/dev/null || echo 0)"
          echo "  'فولاد': $(grep -c 'فولاد' /tmp/mf.html || echo 0) | 'شستا': $(grep -c 'شستا' /tmp/mf.html || echo 0)"
          grep -oE 'https?://[a-zA-Z0-9._-]*api[a-zA-Z0-9._/-]*' /tmp/mf.html | sort -u | head -6

          echo ""
          echo "===== 2) آگاه: معدن‌کاوی online.agah.com ====="
          g "https://online.agah.com/" /tmp/ag.html
          echo "  حجم صفحه: $(wc -c < /tmp/ag.html 2>/dev/null || echo 0)"
          for js in $(grep -oE '(src|href)="[^"]+\.js[^"]*"' /tmp/ag.html | sed -E 's/^[^"]*="//; s/"$//' | sort -u | head -6); do
            case "$js" in
              http*) u="$js" ;;
              /*)    u="https://online.agah.com$js" ;;
              *)     u="https://online.agah.com/$js" ;;
            esac
            g "$u" /tmp/a.js
            sz=$(wc -c < /tmp/a.js 2>/dev/null || echo 0)
            [ "$sz" -lt 1500 ] && continue
            echo "  JS($sz): ${u:0:90}"
            grep -oE 'https?://[a-zA-Z0-9._/-]{6,90}' /tmp/a.js | grep -viE 'w3\.org|schema|google|sentry|npm|github|react|facebook|unpkg|jsdelivr|polyfill|localhost|gstatic' | sort -u | head -8
            grep -oE '"/[a-zA-Z0-9_/.-]{3,60}"' /tmp/a.js | grep -iE 'api|market|instrument|symbol|search|candle|quote|watch' | sort -u | head -12
          done

          echo ""
          echo "===== 3) رهاورد: کشف buildId و چانک‌ها ====="
          g "https://rahavard365.com/" /tmp/rh.html
          bid=$(grep -oE '"buildId":"[^"]*"' /tmp/rh.html | head -1 | sed 's/.*:"//; s/"//')
          echo "  buildId: ${bid:-پیدا نشد}"
          if [ -n "$bid" ]; then
            g "https://rahavard365.com/_next/static/$bid/_buildManifest.js" /tmp/bm.js
            echo "  buildManifest: $(wc -c < /tmp/bm.js 2>/dev/null || echo 0) bytes"
            for c in $(grep -oE 'static/chunks/[a-zA-Z0-9._/-]+\.js' /tmp/bm.js | sort -u | head -6); do
              g "https://rahavard365.com/_next/$c" /tmp/c.js
              sz=$(wc -c < /tmp/c.js 2>/dev/null || echo 0)
              [ "$sz" -lt 2000 ] && continue
              echo "  chunk($sz): ${c:0:70}"
              grep -oE '"/api[a-zA-Z0-9_/.-]{0,60}"' /tmp/c.js | sort -u | head -10
            done
          fi

          echo ""
          echo "===== 4) TGJU: آیا سهم بورس دارد؟ ====="
          g "https://www.tgju.org/%D8%A8%D9%88%D8%B1%D8%B3" /tmp/tj.html
          echo "  صفحه بورس: $(wc -c < /tmp/tj.html 2>/dev/null || echo 0) | 'فولاد': $(grep -c 'فولاد' /tmp/tj.html || echo 0) | 'شاخص': $(grep -c 'شاخص' /tmp/tj.html || echo 0)"
          g "https://www.tgju.org/stock" /tmp/tj2.html
          echo "  صفحه stock: $(wc -c < /tmp/tj2.html 2>/dev/null || echo 0) | 'فولاد': $(grep -c 'فولاد' /tmp/tj2.html || echo 0)"

          echo ""
          echo "===== 5) پروب‌های تکمیلی ====="
          for u in "https://www.codal.ir/" "https://www.seo.ir/" "https://www.icapital.ir/" "https://sahmad.com/"; do
            rm -f /tmp/p.html
            code=$(curl -sL -o /tmp/p.html -A "$UA" --max-time 15 -w "%{http_code}" "$u" 2>/dev/null)
            [ -z "$code" ] && code=000
            echo "  $u => $code ($(wc -c < /tmp/p.html 2>/dev/null || echo 0) bytes)"
          done

          echo ""
          echo "===== 6) جستجوی دیتاست تازه TSETMC در گیت‌هاب ====="
          curl -s "https://api.github.com/search/repositories?q=tsetmc&sort=updated&order=desc&per_page=8" -o /tmp/gh1.json
          curl -s "https://api.github.com/search/repositories?q=tehran%20stock%20exchange&sort=updated&order=desc&per_page=8" -o /tmp/gh2.json
          python3 - <<'PY'
          import json
          for f in ["/tmp/gh1.json","/tmp/gh2.json"]:
              try:
                  d=json.load(open(f))
                  print(f"  --- {f} ---")
                  for r in d.get("items",[])[:8]:
                      print(f"  {r['full_name']} | آخرین push: {r['pushed_at'][:10]} | ستاره: {r['stargazers_count']}")
              except Exception as e:
                  print("  خطا:", e)
          PY
