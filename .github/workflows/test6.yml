name: test6-final
on: {workflow_dispatch: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: final-mining
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          S="$GITHUB_STEP_SUMMARY"

          hdr(){ echo; echo "===== $1 ====="; }
          probe(){
            code=$(curl -sL -o /dev/null -A "$UA" --max-time 10 -w "%{http_code}" "$1" 2>/dev/null)
            case "$code" in ''|*[!0-9]*) code=000;; esac
            echo "  $1 => $code"
            echo "- \`$1\` => **$code**" >> "$S"
          }
          g(){ curl -sL -A "$UA" --max-time 12 "$1" -o "$2" 2>/dev/null; }

          hdr "۰) دسترسی هاست‌های کلیدی (مهم‌ترین: tsetmc اصلی!)"
          probe "https://www.tsetmc.com/"
          probe "https://cdn.tsetmc.com/"
          probe "https://api.rahavard365.com/"
          probe "https://codal360.ir/"
          probe "https://hoozban.com/"
          probe "https://sahmchart.ir/"
          probe "https://boursepress.ir/"

          hdr "۱) مفید — داده داخل HTML؟"
          g "https://www.emofid.com/market-watch/" /tmp/mf.html
          echo "حجم: $(wc -c < /tmp/mf.html 2>/dev/null || echo 0)"
          for s in فولاد شستا شپنا فملی وبملت; do
            echo "  $s: $(grep -o "$s" /tmp/mf.html 2>/dev/null | wc -l) بار"
          done
          python3 - <<'PY'
          import re, json
          h = open('/tmp/mf.html', encoding='utf-8', errors='ignore').read()
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
          print("  __NEXT_DATA__:", "هست ✅" if m else "نیست")
          if m:
              d = json.loads(m.group(1))
              def walk(x, p=""):
                  if isinstance(x, list) and len(x) > 50 and isinstance(x[0], dict):
                      print(f"  🎯 لیست {len(x)} عضوی در {p} | کلیدها: {list(x[0])[:12]}")
                  if isinstance(x, dict):
                      for k, v in x.items(): walk(v, p + "/" + k)
                  elif isinstance(x, list):
                      for v in x[:3]: walk(v, p + "[]")
              walk(d)
          PY
          for js in $(grep -oE '(src|href)="[^"]+\.js[^"]*"' /tmp/mf.html | sed -E 's/^[^"]*="//; s/"$//' | sort -u | head -8); do
            case "$js" in http*) u="$js";; /*) u="https://www.emofid.com$js";; *) u="https://www.emofid.com/$js";; esac
            g "$u" /tmp/j.js
            sz=$(wc -c < /tmp/j.js 2>/dev/null); [ "${sz:-0}" -lt 3000 ] && continue
            hits=$(grep -oE 'https?://[a-zA-Z0-9._-]+[a-zA-Z0-9._/-]*|"/api/[a-zA-Z0-9_/-]{2,50}"' /tmp/j.js 2>/dev/null | grep -iE 'api' | sort -u | head -6)
            [ -n "$hits" ] && { echo "  JS ${u:0:75} ($((sz/1024))KB):"; echo "$hits" | sed 's/^/    /'; }
          done

          hdr "۲) رهاورد — کشف API"
          g "https://rahavard365.com/" /tmp/rh.html
          bid=$(grep -oE '"buildId":"[^"]+"' /tmp/rh.html | head -1 | cut -d'"' -f4)
          echo "buildId: ${bid:-پیدا نشد}"
          if [ -n "$bid" ]; then
            g "https://rahavard365.com/_next/static/$bid/_buildManifest.js" /tmp/bm.js
            grep -oE 'static/chunks/[^"]+\.js' /tmp/bm.js 2>/dev/null | sort -u | head -12 > /tmp/ch.txt
            echo "چانک‌ها: $(wc -l < /tmp/ch.txt)"
            while read -r c; do
              g "https://rahavard365.com/_next/$c" /tmp/c.js
              sz=$(wc -c < /tmp/c.js 2>/dev/null); [ "${sz:-0}" -lt 2000 ] && continue
              h=$(grep -oE '"(https?://[^"]*api[^"]*|/api/[a-zA-Z0-9_/.-]{2,60})"' /tmp/c.js 2>/dev/null | sort -u | head -8)
              [ -n "$h" ] && { echo "  چانک ${c##*/} ($((sz/1024))KB):"; echo "$h" | sed 's/^/    /'; }
            done < /tmp/ch.txt
          fi

          hdr "۳) آگاه آنلاین — کشف API"
          g "https://online.agah.com/" /tmp/ag.html
          echo "حجم صفحه: $(wc -c < /tmp/ag.html 2>/dev/null || echo 0)"
          for js in $(grep -oE '(src|href)="[^"]+\.js[^"]*"' /tmp/ag.html | sed -E 's/^[^"]*="//; s/"$//' | sort -u | head -8); do
            case "$js" in http*) u="$js";; /*) u="https://online.agah.com$js";; *) u="https://online.agah.com/$js";; esac
            g "$u" /tmp/a.js
            sz=$(wc -c < /tmp/a.js 2>/dev/null); [ "${sz:-0}" -lt 3000 ] && continue
            h=$(grep -oE 'https?://[a-zA-Z0-9._/-]+|"/[a-zA-Z0-9_/-]{3,50}"' /tmp/a.js 2>/dev/null | grep -iE 'api|market|instrument|symbol|candle|quote' | sort -u | head -10)
            [ -n "$h" ] && { echo "  JS ${u:0:75} ($((sz/1024))KB):"; echo "$h" | sed 's/^/    /'; }
          done

          hdr "۴) دیتاست روزانه در گیت‌هاب"
          curl -s --max-time 15 "https://api.github.com/search/repositories?q=tsetmc&sort=updated&order=desc&per_page=10" -o /tmp/g1.json 2>/dev/null
          curl -s --max-time 15 "https://api.github.com/search/repositories?q=tehran+stock+exchange&sort=updated&order=desc&per_page=10" -o /tmp/g2.json 2>/dev/null
          python3 - <<'PY'
          import json
          seen = set()
          for f in ("/tmp/g1.json", "/tmp/g2.json"):
              try: d = json.load(open(f))
              except Exception: continue
              for r in d.get("items", [])[:10]:
                  if r["full_name"] in seen: continue
                  seen.add(r["full_name"])
                  print(f"  {r['full_name']} | آخرین push: {r['pushed_at'][:10]} | ⭐{r['stargazers_count']}")
          if not seen: print("  (چیزی پیدا نشد)")
          PY

          echo ""
          echo "=== END — اسکریپت تا انتها اجرا شد ==="
