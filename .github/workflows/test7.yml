name: test7-scout
on: {workflow_dispatch: {}}
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: scout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0"

          echo "=== ۰) پروب‌های سریع زیردامنه‌ها ==="
          for u in gateway.emofid.com data.emofid.com gateway.agah.com data.agah.com api2.agah.com; do
            code=$(curl -s -o /dev/null -A "$UA" --max-time 6 -w "%{http_code}" "https://$u/" 2>/dev/null)
            echo "  $u => ${code:-000}"
          done
          echo "  sahmad نهایی: $(curl -s -o /dev/null -L -A "$UA" --max-time 10 -w '%{url_effective} [%{http_code}]' https://sahmad.com/)"

          echo ""
          echo "=== ۱) رهاورد: مسیر صفحات واقعی ==="
          curl -sL -A "$UA" --max-time 15 https://rahavard365.com/ -o /tmp/rh.html
          bid=$(grep -oE '"buildId":"[^"]+"' /tmp/rh.html | head -1 | cut -d'"' -f4)
          curl -sL -A "$UA" --max-time 15 "https://rahavard365.com/_next/static/$bid/_buildManifest.js" -o /tmp/bm.js
          echo "  buildId: $bid"
          grep -oE '"/[a-zA-Z0-9_./-]{1,40}":' /tmp/bm.js | tr -d '":' | sort -u | head -25 | sed 's/^/  route: /'
          echo "  --- تلاش دادهٔ SSR صفحات ---"
          for r in $(grep -oE '"/[a-zA-Z0-9_-]{1,30}":' /tmp/bm.js | tr -d '":' | grep -vE '^/+$' | head -3); do
            curl -sL -A "$UA" --max-time 10 "https://rahavard365.com$r" -o /tmp/pg.html
            echo "  صفحه $r => $(wc -c < /tmp/pg.html 2>/dev/null) بایت | فولاد: $(grep -o 'فولاد' /tmp/pg.html 2>/dev/null | wc -l) بار"
            code=$(curl -sL -o /tmp/nd.json -A "$UA" --max-time 10 -w "%{http_code}" "https://rahavard365.com/_next/data/$bid$r.json")
            echo "    data $r.json => $code ($(wc -c < /tmp/nd.json 2>/dev/null) بایت)"
          done

          echo ""
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse

          H = {"User-Agent":"scout","Accept":"application/vnd.github+json"}
          if os.environ.get("GH_TOKEN"): H["Authorization"] = "Bearer "+os.environ["GH_TOKEN"]

          def get(u):
              try:
                  return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=15).read().decode("utf-8","ignore"))
              except Exception as e:
                  return {"__err":str(e)[:70]}

          def raw(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"scout"}),timeout=15).read().decode("utf-8","ignore")
              except Exception:
                  return ""

          queries = ["tsetmc","tehran stock exchange","bourse csv iran","tsetmc market watch","بورس تهران","بورس داده"]
          repos = {}
          for q in queries:
              d = get("https://api.github.com/search/repositories?q=%s&sort=updated&order=desc&per_page=8"%urllib.parse.quote(q))
              for r in (d or {}).get("items",[]) or []: repos[r["full_name"]]=r
          print("=== ۲) اسکات %d ریپوی کاندید ==="%len(repos))

          promising=[]
          for r in sorted(repos.values(),key=lambda r:r["pushed_at"],reverse=True)[:15]:
              name=r["full_name"]; br=r.get("default_branch") or "main"
              print("\n## %s | push: %s | ⭐%d"%(name,r["pushed_at"][:10],r["stargazers_count"]))
              t=get("https://api.github.com/repos/%s/git/trees/%s?recursive=1"%(name,br))
              if "__err" in t: print("   tree:",t["__err"]); continue
              files=[f["path"] for f in t.get("tree",[]) if f.get("type")=="blob"]
              data=[p for p in files if re.search(r"\.(csv|json|xlsx|parquet)$",p,re.I)]
              dated=[p for p in data if re.search(r"\d{4}-\d{2}-\d{2}",p)]
              wfs=[p for p in files if p.startswith(".github/workflows/")]
              print("   داده‌ای: %d | تاریخ‌دار: %d | workflow: %d"%(len(data),len(dated),len(wfs)))
              for p in sorted(dated)[-4:]: print("   دیتا: "+p)
              if not data: continue
              c=get("https://api.github.com/repos/%s/commits?per_page=1"%name)
              if isinstance(c,list) and c:
                  print("   آخرین کامیت: %s | %s"%(c[0]["commit"]["author"]["date"][:10],c[0]["commit"]["message"][:70].replace("\n"," ")))
              promising.append((name,br,sorted(dated or data)))

          print("\n=== ۳) نمونه‌برداری از دیتاست‌های تازه ===")
          for name,br,paths in promising[:5]:
              p=paths[-1]
              txt=raw("https://raw.githubusercontent.com/%s/%s/%s"%(name,br,p.lstrip("/")))
              print("\n## %s :: %s (%d بایت)"%(name,p,len(txt)))
              print("   "+txt[:350].replace("\n"," ⏎ "))

          print("\n=== ۴) ترفند دسترسی ریپوها (workflowها) ===")
          for name,br,paths in promising[:4]:
              t=get("https://api.github.com/repos/%s/git/trees/%s?recursive=1"%(name,br))
              if "__err" in t: continue
              wfs=[f["path"] for f in t.get("tree",[]) if f.get("type")=="blob" and f["path"].startswith(".github/workflows/")]
              for w in wfs[:2]:
                  txt=raw("https://raw.githubusercontent.com/%s/%s/%s"%(name,br,w))
                  if not txt: continue
                  urls=sorted(set(u for u in re.findall(r"https?://[^\s\"'<>]+",txt) if "github" not in u))[:8]
                  print("\n## %s :: %s"%(name,w))
                  for u in urls: print("   URL: "+u[:110])
                  if "tsetmc" in txt.lower(): print("   ⚡ این workflow به tsetmc می‌زند!")

          print("\n=== ۵) READMEهای کلیدی ===")
          for name in ["abebr/awesome-tsetmc-filters-iran-stocks","yghaderi/oxtapus","Ebddgr/tsetmc-ytm","abebr/tsetmc-stock-filters"]:
              txt=raw("https://raw.githubusercontent.com/%s/HEAD/README.md"%name)
              urls=sorted(set(u for u in re.findall(r"https?://[^\s\"'<>)]+",txt) if "github.com" not in u and "shields" not in u))[:10]
              print("\n## %s (%d بایت)"%(name,len(txt)))
              for u in urls: print("   URL: "+u[:110])

          print("\n=== END — اسکات کامل اجرا شد ===")
          PY
