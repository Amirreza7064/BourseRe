name: test5-decisive
on: {workflow_dispatch: {}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: decisive
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"

          echo "===== ۰) پروب تمیز (هر بار فایل خالی) ====="
          for u in "https://www.tse.ir/" "https://www.codal.ir/" "https://www.seo.ir/"; do
            rm -f /tmp/p.html
            code=$(curl -sL -o /tmp/p.html -A "$UA" --max-time 15 -w "%{http_code}" "$u" 2>/dev/null)
            [ -z "$code" ] && code=000
            echo "  $u => $code ($(wc -c < /tmp/p.html 2>/dev/null || echo 0) bytes)"
          done

          echo ""
          echo "===== ۱) مفید: آیا دادهٔ بازار داخل HTML است؟ ====="
          curl -sL -A "$UA" --max-time 30 "https://www.emofid.com/market-watch/" -o /tmp/mf.html
          echo "حجم: $(wc -c < /tmp/mf.html) بایت"
          echo "-- شمارش واقعی تکرار --"
          for s in فولاد فملی شستا شپنا وبملت خساپا; do
            echo "  $s => $(grep -o "$s" /tmp/mf.html | wc -l) بار"
          done
          echo "-- کلیدهای داده --"
          for k in insCode pClosing zTotTran priceChange NEXT_DATA; do
            echo "  $k => $(grep -o "$k" /tmp/mf.html | wc -l) بار"
          done
          echo "-- ۳۰۰ کاراکتر اطراف اولین «فولاد» --"
          grep -o '.\{150\}فولاد.\{150\}' /tmp/mf.html | head -1 || echo "(پیدا نشد)"
          echo ""
          python3 - <<'PY'
          import re, json
          html = open('/tmp/mf.html', encoding='utf-8', errors='ignore').read()
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
          if not m:
              print("__NEXT_DATA__ وجود ندارد")
          else:
              print(f"__NEXT_DATA__: {len(m.group(1))//1024} KB")
              d = json.loads(m.group(1))
              def find(d, path=""):
                  if isinstance(d, list) and len(d) > 50:
                      ks = list(d[0].keys())[:14] if isinstance(d[0], dict) else d[0]
                      print(f"🎯 آرایه بزرگ: {path} | تعداد: {len(d)} | کلیدها: {ks}")
                  if isinstance(d, dict):
                      for k, v in d.items(): find(v, f"{path}/{k}")
                  elif isinstance(d, list):
                      for i, v in enumerate(d[:3]): find(v, f"{path}[{i}]")
              find(d)
          PY

          echo ""
          echo "===== ۲) رهاورد: کشف API از buildManifest ====="
          curl -sL -A "$UA" --max-time 25 "https://rahavard365.com/" -o /tmp/rh.html
          bid=$(grep -oE '"buildId":"[^"]+"' /tmp/rh.html | head -1 | cut -d'"' -f4)
          echo "buildId: ${bid:-پیدا نشد}"
          if [ -n "$bid" ]; then
            curl -sL -A "$UA" --max-time 25 "https://rahavard365.com/_next/static/$bid/_buildManifest.js" -o /tmp/bm.js
            grep -oE 'static/chunks/[^"]+\.js' /tmp/bm.js | sort -u > /tmp/chunks.txt
            echo "تعداد چانک‌ها: $(wc -l < /tmp/chunks.txt)"
            n=0
            while read -r c && [ $n -lt 10 ]; do
              curl -sL -A "$UA" --max-time 20 "https://rahavard365.com/_next/$c" -o /tmp/c.js
              sz=$(wc -c < /tmp/c.js); [ "$sz" -lt 3000 ] && continue
              hits=$(grep -oE '"/?api/[a-zA-Z0-9_/.-]{2,60}"' /tmp/c.js | sort -u | head -8)
              if [ -n "$hits" ]; then
                echo "  چانک ${c##*/} ($((sz/1024))KB):"
                echo "$hits" | sed 's/^/    /'
              fi
              n=$((n+1))
            done < /tmp/chunks.txt
          fi

          echo ""
          echo "===== ۳) گیت‌هاب: دیتاست تازهٔ TSETMC ====="
          curl -s "https://api.github.com/search/repositories?q=tsetmc&sort=updated&order=desc&per_page=10" -o /tmp/g1.json
          curl -s "https://api.github.com/search/repositories?q=%22tehran+stock%22&sort=updated&order=desc&per_page=10" -o /tmp/g2.json
          python3 - <<'PY'
          import json
          seen = set()
          for f in ("/tmp/g1.json", "/tmp/g2.json"):
              try: d = json.load(open(f))
              except Exception: continue
              for r in d.get("items", []):
                  if r["full_name"] in seen: continue
                  seen.add(r["full_name"])
                  print(f"  {r['full_name']} | آخرین push: {r['pushed_at'][:10]} | ⭐{r['stargazers_count']}")
          if not seen: print("  نتیجه‌ای نبود")
          PY
