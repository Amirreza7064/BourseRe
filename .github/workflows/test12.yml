name: test12-databourse-final
on: {workflow_dispatch: {}}
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: final-mapping
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          B="https://databourse.ir"
          ENC=$(python3 -c "import urllib.parse;print(urllib.parse.quote('فولاد'))")
          g(){ curl -sL -A "$UA" --max-time 25 "$1" -o "$2" 2>/dev/null; }

          echo "=== ۱) صفحهٔ نماد: کالبدشکافی کامل ==="
          g "$B/symbol/$ENC" /tmp/sy.html
          echo "حجم: $(wc -c < /tmp/sy.html) بایت"
          echo "-- تیتر صفحه:"
          grep -oE '<title>[^<]*</title>' /tmp/sy.html | head -2 | sed 's/^/  /'
          echo "-- جدول‌ها: $(grep -o '<table' /tmp/sy.html | wc -l)"
          echo "-- بافت اطراف «فولاد»:"
          grep -o '.\{100\}فولاد.\{100\}' /tmp/sy.html | head -4 | sed 's/^/  /'
          echo "-- نمونهٔ اعداد بزرگ (قیمت‌ها):"
          grep -oE '>[0-9,]{5,12}<' /tmp/sy.html | sort -u | head -15 | sed 's/^/  /'
          echo "-- اعداد با ممیز (قیمت‌های اعشاری):"
          grep -oE '>[0-9]+\.[0-9]{2}<' /tmp/sy.html | sort -u | head -10 | sed 's/^/  /'
          echo "-- کلمات کلیدی دادهٔ تاریخی:"
          for k in سابقه تاریخچه کندل شمعی نمودار max min candle chart o h l c; do
            echo "  «$k»: $(grep -oi "$k" /tmp/sy.html | wc -l)"
          done
          echo "-- لینک‌های داخل صفحهٔ نماد (غیر css/فونت):"
          grep -oE 'href="[^"]+"' /tmp/sy.html | sed 's/href="//; s/"$//' | grep -vE '\.(css|woff|ico|webp|js)' | grep -v '^#' | sort -u | head -20 | sed 's/^/  /'

          echo ""
          echo "=== ۲) صفحهٔ marketwatch (کل بازار!) ==="
          g "$B/marketwatch" /tmp/mw.html
          echo "حجم: $(wc -c < /tmp/mw.html) | فولاد: $(grep -o 'فولاد' /tmp/mw.html | wc -l) | خساپا: $(grep -o 'خساپا' /tmp/mw.html | wc -l)"
          echo "-- نمونهٔ ردیف جدول:"
          grep -o '<tr[^>]*>.*فولاد.*</tr>' /tmp/mw.html | head -1 | sed 's/^/  /' | head -c 500; echo

          echo ""
          echo "=== ۳) صفحهٔ stats و indices ==="
          for p in stats indices "filter/smart-money-inflow"; do
            g "$B/$p" /tmp/x.html
            echo "  /$p => $(wc -c < /tmp/x.html)B | فولاد: $(grep -o 'فولاد' /tmp/x.html | wc -l) | جدول: $(grep -o '<table' /tmp/x.html | wc -l)"
          done

          echo ""
          echo "=== ۴) JS کوچک سایت: آیا URL داده می‌سازد؟ ==="
          g "$B/js/db.v1.0.js" /tmp/db.js
          cat /tmp/db.js | head -c 3000; echo

          echo ""
          echo "=== ۵) پروب صفحات تاریخچهٔ احتمالی زیر صفحهٔ نماد ==="
          for p in "symbol/$ENC/history" "symbol/$ENC/tse" "symbol/$ENC?tab=history" "symbol/$ENC/prices"; do
            c=$(curl -sL -A "$UA" --max-time 15 -o /tmp/h.html -w "%{http_code}" "$B/$p" 2>/dev/null)
            [ -z "$c" ] && c=000
            echo "  /$p => $c | $(wc -c < /tmp/h.html 2>/dev/null || echo 0)B | فولاد:$(grep -o 'فولاد' /tmp/h.html 2>/dev/null | wc -l)"
          done

          echo ""
          echo "=== END ==="
